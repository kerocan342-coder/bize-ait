<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <title>Biz</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0f0f0f;
      color: #fff;
      text-align: center;
    }
    h1 {
      margin-top: 30px;
      font-size: 32px;
      letter-spacing: 2px;
    }
    .date {
      margin: 10px 0 30px;
      font-size: 16px;
      color: #ccc;
    }
    .gallery img {
      width: 90%;
      max-width: 400px;
      margin: 15px auto;
      border-radius: 12px;
      display: block;
    }
    .text {
      max-width: 700px;
      margin: 40px auto;
      font-size: 18px;
      line-height: 1.6;
      padding: 0 20px;
    }
    audio {
      margin: 30px 0;
    }
  </style>
</head>
<body>

  <h1>Biz</h1>
  <div class="date">18 / 12 / 2023</div>

  <audio controls>
    <source src="sarki.mp3" type="audio/mpeg">
    Tarayıcın sesi desteklemiyor.
  </audio>

  <div class="gallery">
    <img src="1.jpg">
    <img src="2.jpg">
    <img src="3.jpg">
    <img src="4.jpg">
    <img src="5.jpg">
  </div>

  <div class="text">
    Bazı anlar vardır…<br><br>
    Zaman durur, kelimeler eksik kalır ama kalp her şeyi söyler.<br><br>
    O günden beri hayatımda birçok şey değişti.<br>
    Daha az yalnız, daha çok biz oldum.<br><br>
    Gülüşün bazen bir şiir,
    bazen sustuğum yer oldu.<br><br>
    Bu sayfa; anıların, şarkının
    ve kalbimin küçük bir izi.
  </div>

</body>
</html>
